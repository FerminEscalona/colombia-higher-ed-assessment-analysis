general:
  random_state: 42
  population: "lowest_inse_quartile"
  resilience_percentile_threshold: 90
  rare_category_threshold: 0.005

kmeans:
  pca_variance_candidates: [0.70, 0.80, 0.85, 0.90]
  cluster_candidates: [3, 4, 5, 6, 7, 8, 9, 10]
  maximum_largest_cluster_percentage: 40
  n_init: 30
  max_iter: 500

dbscan:
  sample_size: 30000
  pca_components: 3
  whiten: true
  min_samples_candidates: [30, 40, 50]
  distance_quantile_candidates: [0.90, 0.92, 0.94, 0.96]
  accepted_cluster_range: [3, 12]
  accepted_noise_percentage_range: [2, 15]
  maximum_largest_cluster_percentage: 65

evaluation:
  metrics: [silhouette, davies_bouldin, calinski_harabasz]
