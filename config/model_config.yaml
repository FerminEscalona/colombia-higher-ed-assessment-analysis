general:
  random_state: 42
  target_column: "puntaje_global"
  features_to_drop: []

train_test_split:
  test_size: 0.2
  shuffle: true
  random_state: 42

models:
  baseline:
    type: "LinearRegression"
    fit_intercept: true
  random_forest:
    n_estimators: 100
    max_depth: 10
    random_state: 42
    n_jobs: -1

evaluation:
  metrics:
    - "rmse"
    - "mae"
    - "r2"
